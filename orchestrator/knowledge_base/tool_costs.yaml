# Costi empirici per tool della pipeline FTD
# Valori misurati su immagini MRI NIFD (risoluzione standard 1mm isotropica)
# Aggiornare dopo ogni dry-run con i valori misurati sull'host corrente

fastsurfer:
  vram_gb_per_subject: 3.5       # VRAM GPU per soggetto in parallelo
  ram_gb_per_subject: 4.0        # RAM host per soggetto (parte CPU)
  bottleneck: "gpu"

freesurfer:
  ram_gb_per_subject: 7.0        # RAM per soggetto (recon-all)
  bottleneck: "cpu_ram"

pyradiomics:
  ram_gb_per_job: 2.0            # RAM per job interno (--jobs)
  bottleneck: "cpu_ram"

# Margini di sicurezza
safety_margins:
  vram: 0.80       # usa max 80% della VRAM disponibile
  ram:  0.80       # usa max 80% della RAM disponibile
  cpu:  0.85       # usa max 85% dei thread CPU disponibili

# Soglie minime per fastsurfer su GPU
fastsurfer_min_vram_gb: 6.0      # minimo per lanciare almeno 1 soggetto su GPU
